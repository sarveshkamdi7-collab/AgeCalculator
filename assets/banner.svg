<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Age Calculator banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a1f"/>
      <stop offset="55%" stop-color="#0d3b3a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>

  <g opacity="0.95">
    <rect x="940" y="58" width="196" height="196" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#5eead4" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M 940 106 L 1136 106" stroke="#5eead4" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="972" cy="82" r="6" fill="#fbbf24"/>
    <circle cx="996" cy="82" r="6" fill="#5eead4" fill-opacity="0.7"/>
    <circle cx="1020" cy="82" r="6" fill="#5eead4" fill-opacity="0.4"/>
    <g fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">
      <text x="972" y="140">M</text><text x="1012" y="140">T</text><text x="1052" y="140">W</text><text x="1092" y="140">T</text>
      <text x="972" y="178">F</text><text x="1012" y="178">S</text><text x="1052" y="178">S</text><text x="1092" y="178">M</text>
    </g>
    <g fill="#99f6e4" fill-opacity="0.65">
      <rect x="959" y="196" width="25" height="25" rx="5"/><rect x="999" y="196" width="25" height="25" rx="5"/>
      <rect x="1039" y="196" width="25" height="25" rx="5"/><rect x="1079" y="196" width="25" height="25" rx="5"/>
      <rect x="959" y="228" width="25" height="25" rx="5"/>
    </g>
    <rect x="999" y="196" width="25" height="25" rx="5" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="1060" cy="226" r="52" fill="#071a1f" stroke="#5eead4" stroke-width="4"/>
    <path d="M 1060 194 L 1060 226 L 1084 240" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1060" cy="226" r="5" fill="#5eead4"/>
  </g>

  <text x="80" y="70" fill="#5eead4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="5">PYTHON  &#183;  TERMINAL  &#183;  DATE MATH</text>
  <text x="76" y="152" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1">AGE</text>
  <text x="76" y="214" fill="url(#accent)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1">CALCULATOR</text>
  <text x="80" y="256" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">Years, months and days &#8212; counted from scratch, leap years included.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
    <rect x="80" y="272" width="112" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="100" y="291">Python 3.6+</text>
    <rect x="204" y="272" width="132" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="224" y="291">No dependencies</text>
    <rect x="348" y="272" width="106" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="368" y="291">MIT License</text>
  </g>
</svg>
