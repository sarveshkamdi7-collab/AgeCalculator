<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Sample terminal session of the Age Calculator">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="470" rx="16" fill="#010409"/>
  <rect x="10" y="10" width="980" height="450" rx="12" fill="url(#win)" stroke="#30363d" stroke-width="1"/>
  <path d="M 10 60 L 990 60" stroke="#30363d" stroke-width="1"/>

  <circle cx="42" cy="35" r="7" fill="#ff5f56"/>
  <circle cx="66" cy="35" r="7" fill="#ffbd2e"/>
  <circle cx="90" cy="35" r="7" fill="#27c93f"/>
  <text x="500" y="40" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Terminal  -  age_calculator.py</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15.5">
    <text x="40" y="98"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" dx="10">python age_calculator.py</tspan></text>
    <text x="40" y="128"><tspan fill="#e6edf3">Enter name of user: </tspan><tspan fill="#ffd866">Sarvesh</tspan></text>
    <text x="40" y="158"><tspan fill="#e6edf3">Enter your birthday in format (YYYY-MM-DD): </tspan><tspan fill="#ffd866">2000-05-15</tspan></text>
    <text x="40" y="188" fill="#484f58">____________________________________________________________________________</text>
    <text x="40" y="222" fill="#c9d1d9">: Name of user is <tspan fill="#5eead4">Sarvesh</tspan></text>
    <text x="40" y="256" fill="#c9d1d9">: Your age is <tspan fill="#fbbf24">26 years, 6 months, 9 days</tspan></text>
    <text x="40" y="290" fill="#c9d1d9">: Total months passed since your birth: <tspan fill="#79c0ff">318</tspan></text>
    <text x="40" y="324" fill="#c9d1d9">: Total days passed since your birth: <tspan fill="#79c0ff">9689</tspan></text>
    <text x="40" y="354" fill="#484f58">____________________________________________________________________________</text>
    <text x="40" y="396" fill="#6e7681"># run on 2026-11-24</text>
    <rect x="40" y="412" width="10" height="18" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
