<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Diagram of the Age Calculator date logic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#102a32"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1000" height="470" rx="16" fill="url(#bg)"/>
  <text x="40" y="54" fill="#5eead4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">UNDER THE HOOD</text>
  <text x="40" y="92" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800">How the date math works</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="130" width="210" height="86" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="60" y="160" fill="#94a3b8" font-size="13" font-weight="600">INPUT</text>
    <text x="60" y="190" fill="#e2e8f0" font-size="17">Birth date</text>
    <text x="60" y="210" fill="#e2e8f0" font-size="17">Today's date</text>

    <path d="M 250 173 L 320 173" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="330" y="118" width="300" height="60" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="350" y="143" fill="#5eead4" font-size="15" font-weight="700">leap_year(year)</text>
    <text x="350" y="165" fill="#cbd5e1" font-size="13">divisible by 4, except 100 unless 400</text>

    <rect x="330" y="192" width="300" height="60" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="350" y="217" fill="#5eead4" font-size="15" font-weight="700">month_days(month, year)</text>
    <text x="350" y="239" fill="#cbd5e1" font-size="13">28 / 29 / 30 / 31 per month</text>

    <rect x="330" y="266" width="300" height="60" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="350" y="291" fill="#5eead4" font-size="15" font-weight="700">day_of_year(d)</text>
    <text x="350" y="313" fill="#cbd5e1" font-size="13">ordinal position of a date (Jan 1 = 1)</text>

    <path d="M 630 173 L 660 173 L 660 296 L 700 296" stroke="#5eead4" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 630 296 L 700 296" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="710" y="130" width="250" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="730" y="158" fill="#fbbf24" font-size="14" font-weight="700">calculate_total_days()</text>
    <text x="730" y="182" fill="#cbd5e1" font-size="13">full years + day-of-year diff</text>
    <text x="730" y="200" fill="#cbd5e1" font-size="13">&#8594; total days</text>

    <rect x="710" y="260" width="250" height="76" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="730" y="288" fill="#fbbf24" font-size="14" font-weight="700">calculate_age()</text>
    <text x="730" y="312" fill="#cbd5e1" font-size="13">subtract, then borrow days</text>
    <text x="730" y="330" fill="#cbd5e1" font-size="13">and months when negative</text>

    <path d="M 660 220 L 660 220" stroke="#5eead4" stroke-width="2"/>
    <text x="40" y="400" fill="#94a3b8" font-size="14">Outputs: exact age (years / months / days) &#183; total months lived &#183; total days lived</text>
    <text x="40" y="430" fill="#64748b" font-size="13">Everything uses only the Python standard library &#8212; no date libraries, no external packages.</text>
  </g>
</svg>
